<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Vua Trực Tuyến - Multiplayer & AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chess Engine & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --board-light: #f0d9b5;
            --board-dark: #b58863;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            align-items: center;
        }

        /* Bàn cờ Responsive */
        .board-container {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 3px solid #334155;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        .square.selected { background-color: #769656 !important; }
        .square.highlight::after {
            content: '';
            width: 30%;
            height: 30%;
            background-color: rgba(0,0,0,0.2);
            border-radius: 50%;
        }

        /* Khung điều khiển */
        .controls {
            width: 100%;
            max-width: 450px;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-box {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input, select, button {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        input { flex: 1; }

        button {
            background: var(--accent-green);
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; }

        .btn-orange { background: #f97316; }
        .btn-blue { background: #3b82f6; }

        /* Màn hình lớn (PC) */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
            }
            h1 { font-size: 2rem; }
            .square { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid =>-chess-king"></i> CỜ VUA TRỰC TUYẾN</h1>
        <div class="user-badge">
            <i class="fa-solid fa-user-check"></i> <span id="my-name">Đang tạo ID...</span> | 
            <b>ID CỦA BẠN: <span id="my-id" style="color: var(--accent-gold);">....</span></b>
        </div>
    </header>

    <div class="container">
        <!-- Bàn cờ -->
        <div class="board-container" id="board"></div>

        <!-- Khung chức năng -->
        <div class="controls">
            <div class="status-box" id="status">Lượt đi: Trắng</div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label style="font-size: 0.85rem; color: #94a3b8;">Chế độ chơi:</label>
                <select id="game-mode" onchange="changeMode()">
                    <option value="online">Đấu Trực Tuyến (Thách đấu ID)</option>
                    <option value="ai">Đấu với Máy (AI)</option>
                    <option value="local">2 Người (Cùng 1 máy)</option>
                </select>
            </div>

            <div class="input-group" id="online-controls">
                <input type="text" id="peer-id-input" placeholder="Nhập ID đối thủ..." maxlength="4">
                <button onclick="connectToPeer()"><i class="fa-solid fa-paper-plane"></i> Đấu</button>
            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn-orange" style="flex:1;" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i> Ván Mới</button>
            </div>
        </div>
    </div>

    <script>
        const game = new Chess();
        let peer = null;
        let conn = null;
        let myColor = 'w';
        let selectedSquare = null;
        let gameMode = 'online';

        // Quân cờ Unicode
        const pieces = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        // Khởi tạo PeerJS với ID Ngẫu nhiên 4 chữ số
        function initPeer() {
            const randomID = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('chess-' + randomID);

            peer.on('open', (id) => {
                const cleanID = id.replace('chess-', '');
                document.getElementById('my-id').innerText = cleanID;
                document.getElementById('my-name').innerText = 'Player_' + cleanID;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                myColor = 'b'; // Người nhận thách đấu cầm quân Đen
                setupConnection();
                alert('Có đối thủ kết nối! Bạn cầm quân ĐEN.');
            });

            peer.on('error', (err) => {
                console.log(err);
                alert('ID đã tồn tại hoặc lỗi kết nối. Hãy tải lại trang!');
            });
        }

        function connectToPeer() {
            const targetID = document.getElementById('peer-id-input').value.trim();
            if (!targetID) return alert('Vui lòng nhập ID đối thủ!');

            conn = peer.connect('chess-' + targetID);
            myColor = 'w'; // Người thách đấu cầm quân Trắng
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                alert('Đã kết nối thành công! Bạn cầm quân TRẮNG.');
                resetGame();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    game.move(data.move);
                    renderBoard();
                    updateStatus();
                } else if (data.type === 'reset') {
                    game.reset();
                    renderBoard();
                    updateStatus();
                }
            });
        }

        // Tạo bàn cờ
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const squareSquare = String.fromCharCode(97 + c) + (8 - r);
                    const isLight = (r + c) % 2 === 0;

                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    squareEl.dataset.square = squareSquare;

                    const piece = board[r][c];
                    if (piece) {
                        const pieceSymbol = piece.color === 'w' 
                            ? pieces[piece.type.toUpperCase()] 
                            : pieces[piece.type];
                        squareEl.innerText = pieceSymbol;
                        squareEl.style.color = piece.color === 'w' ? '#ffffff' : '#000000';
                        if (piece.color === 'w') {
                            squareEl.style.textShadow = '0 0 3px #000';
                        }
                    }

                    if (selectedSquare === squareSquare) {
                        squareEl.classList.add('selected');
                    }

                    squareEl.addEventListener('click', () => handleSquareClick(squareSquare));
                    boardEl.appendChild(squareEl);
                }
            }
        }

        function handleSquareClick(square) {
            if (game.game_over()) return;

            // Nếu đấu online mà không phải lượt của mình -> Bỏ qua
            if (gameMode === 'online') {
                if (!conn || !conn.open) return alert('Chưa kết nối với đối thủ!');
                if (game.turn() !== myColor) return;
            }

            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move) {
                    selectedSquare = null;
                    renderBoard();
                    updateStatus();

                    if (gameMode === 'online' && conn) {
                        conn.send({ type: 'move', move: { from: move.from, to: move.to, promotion: 'q' } });
                    } else if (gameMode === 'ai' && !game.game_over()) {
                        setTimeout(makeAIMove, 400);
                    }
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                    } else {
                        selectedSquare = null;
                    }
                    renderBoard();
                }
            }
        }

        // Nước đi của Máy (AI ngẫu nhiên đơn giản)
        function makeAIMove() {
            const moves = game.moves();
            if (moves.length === 0) return;
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(randomMove);
            renderBoard();
            updateStatus();
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            let statusText = '';

            const turn = game.turn() === 'w' ? 'Trắng' : 'Đen';

            if (game.in_checkmate()) {
                statusText = `THUA MÃ NỐC! Bên ${turn} bị chiếu bí.`;
            } else if (game.in_draw()) {
                statusText = 'HÒA CỜ!';
            } else {
                statusText = `Đến lượt: ${turn}`;
                if (game.in_check()) statusText += ' (ĐANG BỊ CHIẾU!)';
            }

            statusEl.innerText = statusText;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            renderBoard();
            updateStatus();
            if (gameMode === 'online' && conn && conn.open) {
                conn.send({ type: 'reset' });
            }
        }

        function changeMode() {
            gameMode = document.getElementById('game-mode').value;
            const onlineControls = document.getElementById('online-controls');
            if (gameMode === 'online') {
                onlineControls.style.display = 'flex';
            } else {
                onlineControls.style.display = 'none';
            }
            resetGame();
        }

        // Khởi chạy
        initPeer();
        renderBoard();
        updateStatus();
    </script>
</body>
</html>
