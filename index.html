<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua Trực Tuyến Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Chessboard CSS/JS & PeerJS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #1c2541;
            --accent-gold: #ffc107;
            --accent-blue: #00b4d8;
            --accent-green: #2ec4b6;
            --accent-red: #e63946;
            --text-light: #edf2f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-light); min-height: 100vh; padding: 10px; display: flex; flex-direction: column; align-items: center; }

        /* Modal Đăng Nhập */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 41, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }
        .modal-box {
            background: var(--bg-card); padding: 25px; border-radius: 12px;
            width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #3a506b;
        }
        .modal-box h2 { color: var(--accent-gold); margin-bottom: 15px; font-size: 1.4rem; }

        header { text-align: center; margin-bottom: 12px; width: 100%; }
        h1 { color: var(--accent-gold); font-size: 1.5rem; }
        .user-badge { background: rgba(255, 255, 255, 0.08); padding: 6px 14px; border-radius: 20px; display: inline-block; margin-top: 6px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); }

        .main-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 950px; align-items: center; }

        /* Khung chứa bàn cờ vuông vắn 100% */
        .board-box {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
        #myBoard {
            width: 100% !important;
            height: 100% !important;
        }

        .panel { width: 100%; max-width: 440px; background: var(--bg-card); padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
        .status-box { background: #0b1329; padding: 8px; border-radius: 6px; text-align: center; font-weight: 600; color: var(--accent-blue); font-size: 0.95rem; }

        .input-group { display: flex; gap: 8px; width: 100%; }
        input, select, button {
            padding: 10px 12px; border-radius: 6px; border: 1px solid #3a506b;
            background: #0b1329; color: white; font-size: 0.9rem; outline: none;
            -webkit-appearance: none;
        }
        input { flex: 1; min-width: 0; }
        button { background: var(--accent-green); color: white; font-weight: 600; cursor: pointer; border: none; white-space: nowrap; }
        button:active { opacity: 0.8; }

        /* Khung Chat tối ưu cho Mobile */
        .chat-box {
            background: #0b1329; border-radius: 8px; padding: 8px;
            height: 140px; display: flex; flex-direction: column; gap: 6px;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; font-size: 0.85rem;
            display: flex; flex-direction: column; gap: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .msg { padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.08); max-width: 90%; word-break: break-word; }
        .msg.me { background: #1d3557; align-self: flex-end; color: #a8dadc; }
        .msg.peer { background: #3a506b; align-self: flex-start; }

        @media (min-width: 768px) {
            .main-container { flex-direction: row; align-items: flex-start; justify-content: center; }
            .chat-box { height: 180px; }
        }
    </style>
</head>
<body>

    <!-- Popup Đăng Nhập -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-box">
            <h2><i class="fa-solid fa-user-gear"></i> ĐĂNG NHẬP GAME</h2>
            <p style="font-size: 0.85rem; color: #8d99ae; margin-bottom: 15px;">Nhập tên của bạn để tạo ID thi đấu</p>
            <input type="text" id="username-input" placeholder="Nhập tên người chơi..." style="width: 100%; margin-bottom: 15px;" onkeypress="if(event.key==='Enter') login()">
            <button style="width: 100%; padding: 12px; font-size: 1rem;" onclick="login()">VÀO BÀN CỜ</button>
        </div>
    </div>

    <header>
        <h1><i class="fa-solid fa-chess"></i> CỜ VUA TRỰC TUYẾN</h1>
        <div class="user-badge">
            <span id="my-name">Chưa đăng nhập</span> | <b>ID: <span id="my-id" style="color: var(--accent-gold);">....</span></b>
        </div>
    </header>

    <div class="main-container">
        <!-- Bàn cờ -->
        <div class="board-box">
            <div id="myBoard"></div>
        </div>

        <!-- Panel điều khiển -->
        <div class="panel">
            <div class="status-box" id="status">Lượt đi: Trắng</div>

            <div class="input-group">
                <select id="game-mode" style="width:100%" onchange="changeMode()">
                    <option value="online">Đấu Trực Tuyến (Thách đấu ID)</option>
                    <option value="ai">Đấu với Máy (AI)</option>
                    <option value="local">2 Người (Cùng 1 máy)</option>
                </select>
            </div>

            <div class="input-group" id="online-controls">
                <input type="text" id="peer-id-input" placeholder="Nhập ID đối thủ..." maxlength="4" inputmode="numeric">
                <button onclick="requestChallenge()"><i class="fa-solid fa-paper-plane"></i> Thách Đấu</button>
            </div>

            <!-- Chat -->
            <div class="chat-box" id="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="msg" style="color: #8d99ae; text-align:center;">Hệ thống: Nhập ID đối thủ để kết nối</div>
                </div>
                <div class="input-group">
                    <input type="text" id="chat-input" placeholder="Nhắn tin..." inputmode="text" autocomplete="off">
                    <button id="btn-send-chat" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Nút bấm -->
            <div style="display: flex; gap: 8px;">
                <button style="flex:1; background: var(--accent-red);" onclick="resignGame()"><i class="fa-solid fa-flag"></i> Nhận Thua</button>
                <button style="flex:1; background: #f77f00;" onclick="requestReset()"><i class="fa-solid fa-rotate-right"></i> Ván Mới</button>
            </div>
        </div>
    </div>

    <script>
        let board = null;
        let game = new Chess();
        let peer = null, conn = null;
        let myColor = 'w', gameMode = 'online';
        let myUsername = "Player";

        // Bắt sự kiện phím Enter trên điện thoại cho ô Chat
        $(document).ready(function() {
            $('#chat-input').on('keypress', function(e) {
                if (e.which === 13) {
                    sendChat();
                }
            });
        });

        // Xử lý đăng nhập tên
        function login() {
            const name = $('#username-input').val().trim();
            if (!name) return alert('Vui lòng nhập tên người chơi!');
            myUsername = name;
            $('#my-name').text(myUsername);
            $('#login-modal').hide();
            
            // Render bàn cờ đúng kích thước sau khi tắt modal
            setTimeout(() => {
                board.resize();
            }, 100);

            initPeer();
        }

        function initPeer() {
            const randomID = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('chess-' + randomID);

            peer.on('open', id => {
                const cleanID = id.replace('chess-', '');
                $('#my-id').text(cleanID);
            });

            peer.on('connection', connection => {
                connection.on('data', data => {
                    if (data.type === 'challenge_request') {
                        const accept = confirm(`[${data.fromName}] (ID: ${data.fromID}) muốn thách đấu với bạn. Đồng ý?`);
                        if (accept) {
                            conn = connection;
                            myColor = 'b';
                            board.orientation('black');
                            setupConnection();
                            conn.send({ type: 'challenge_response', accepted: true, name: myUsername });
                            addChat('Hệ thống', `Đã kết nối với [${data.fromName}]! Bạn cầm quân ĐEN.`);
                            resetGame();
                        } else {
                            connection.send({ type: 'challenge_response', accepted: false });
                        }
                    } else {
                        handleIncomingData(data);
                    }
                });
            });
        }

        function requestChallenge() {
            const targetID = $('#peer-id-input').val().trim();
            if (!targetID) return alert('Vui lòng nhập ID đối thủ!');

            addChat('Hệ thống', `Đang gửi lời mời tới ID ${targetID}...`);
            const tempConn = peer.connect('chess-' + targetID);

            tempConn.on('open', () => {
                tempConn.send({ 
                    type: 'challenge_request', 
                    fromName: myUsername, 
                    fromID: $('#my-id').text() 
                });
            });

            tempConn.on('data', data => {
                if (data.type === 'challenge_response') {
                    if (data.accepted) {
                        conn = tempConn;
                        myColor = 'w';
                        board.orientation('white');
                        setupConnection();
                        addChat('Hệ thống', `[${data.name}] đã đồng ý! Bạn cầm quân TRẮNG.`);
                        resetGame();
                    } else {
                        alert('Đối thủ đã TỪ CHỐI lời mời!');
                        addChat('Hệ thống', 'Lời mời bị từ chối.');
                    }
                } else {
                    handleIncomingData(data);
                }
            });
        }

        function setupConnection() {
            conn.on('data', data => handleIncomingData(data));
        }

        function handleIncomingData(data) {
            if (data.type === 'move') {
                game.move(data.move);
                board.position(game.fen());
                updateStatus();
            } else if (data.type === 'chat') {
                addChat(data.sender, data.text, 'peer');
            } else if (data.type === 'resign') {
                alert('Đối thủ đã ĐẦU HÀNG! Bạn giành chiến thắng! 🎉');
                addChat('Hệ thống', 'Đối thủ đã đầu hàng.');
            } else if (data.type === 'reset_request') {
                if (confirm('Đối thủ xin chơi VÁN MỚI. Đồng ý?')) {
                    game.reset(); board.start(); updateStatus();
                    conn.send({ type: 'reset_accept' });
                    addChat('Hệ thống', 'Bắt đầu ván mới!');
                }
            } else if (data.type === 'reset_accept') {
                game.reset(); board.start(); updateStatus();
                alert('Đối thủ đã đồng ý tạo ván mới!');
            }
        }

        function onDragStart(source, piece) {
            if (game.game_over()) return false;
            if (gameMode === 'online') {
                if (!conn) return false;
                if ((game.turn() === 'w' && myColor !== 'w') || (game.turn() === 'b' && myColor !== 'b')) return false;
            }
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onDrop(source, target) {
            const move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            updateStatus();
            if (gameMode === 'online' && conn) {
                conn.send({ type: 'move', move: { from: source, to: target, promotion: 'q' } });
            } else if (gameMode === 'ai' && !game.game_over()) {
                setTimeout(makeAIMove, 300);
            }
        }

        function onSnapEnd() { board.position(game.fen()); }

        function sendChat() {
            const txt = $('#chat-input').val().trim();
            if (!txt) return;
            addChat('Bạn', txt, 'me');
            if (gameMode === 'online' && conn) {
                conn.send({ type: 'chat', text: txt, sender: myUsername });
            }
            $('#chat-input').val('');
        }

        function addChat(sender, txt, cls = '') {
            const msgEl = `<div class="msg ${cls}"><b>${sender}:</b> ${txt}</div>`;
            $('#chat-messages').append(msgEl);
            $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
        }

        function resignGame() {
            if (gameMode === 'online' && !conn) return;
            if (confirm('Bạn có chắc chắn muốn NHẬN THUA ván này?')) {
                alert('Bạn đã nhận thua!');
                if (gameMode === 'online' && conn) conn.send({ type: 'resign' });
            }
        }

        function requestReset() {
            if (gameMode === 'online') {
                if (!conn) return alert('Chưa kết nối đối thủ!');
                conn.send({ type: 'reset_request' });
                addChat('Hệ thống', 'Đã gửi yêu cầu ván mới...');
            } else {
                game.reset(); board.start(); updateStatus();
            }
        }

        function resetGame() {
            game.reset();
            board.start();
            updateStatus();
        }

        function updateStatus() {
            let statusText = '';
            const turn = game.turn() === 'w' ? 'Trắng' : 'Đen';
            if (game.in_checkmate()) statusText = `THUA MÃ NỐC! Bên ${turn} bị chiếu bí.`;
            else if (game.in_draw()) statusText = 'HÒA CỜ!';
            else statusText = `Đến lượt: ${turn} ${game.in_check() ? '(ĐANG BỊ CHIẾU!)' : ''}`;
            $('#status').text(statusText);
        }

        function makeAIMove() {
            const moves = game.moves();
            if (moves.length === 0) return;
            game.move(moves[Math.floor(Math.random() * moves.length)]);
            board.position(game.fen());
            updateStatus();
        }

        function changeMode() {
            gameMode = $('#game-mode').val();
            if (gameMode === 'online') $('#online-controls, #chat-container').show();
            else $('#online-controls, #chat-container').hide();
            game.reset(); board.start(); updateStatus();
        }

        const config = {
            draggable: true, position: 'start',
            onDragStart: onDragStart, onDrop: onDrop, onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('myBoard', config);

        // Resize bàn cờ vuông vắn theo kích thước màn hình
        $(window).on('resize orientationchange', function() {
            board.resize();
        });

        updateStatus();
    </script>
</body>
</html>
