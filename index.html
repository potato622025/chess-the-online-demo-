<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua Trực Tuyến</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body { background: #0b1329; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        #myBoard { width: 100% !important; max-width: 400px; touch-action: none; }
        .controls { width: 100%; max-width: 400px; margin-top: 10px; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: none; margin-bottom: 5px; }
        button { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #00b4d8; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div id="myBoard"></div>
    <div class="controls">
        <div id="my-id-display" style="text-align:center; margin-bottom:10px;">Đang lấy ID...</div>
        <input type="text" id="target-id" placeholder="Nhập ID đối thủ...">
        <button onclick="connectToPeer()">THÁCH ĐẤU</button>
    </div>

    <script>
        // Cấu hình STUN Server để xuyên tường lửa
        const peerConfig = {
            config: {
                'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]
            }
        };

        let peer = new Peer(peerConfig); // Tạo Peer không tiền tố
        let conn = null;

        peer.on('open', id => {
            $('#my-id-display').text("ID CỦA BẠN: " + id);
        });

        peer.on('connection', c => {
            conn = c;
            setupConn();
            alert("Đối thủ đã kết nối!");
        });

        function connectToPeer() {
            let target = $('#target-id').val();
            conn = peer.connect(target, peerConfig);
            setupConn();
        }

        function setupConn() {
            conn.on('open', () => alert("Đã kết nối thành công!"));
            conn.on('data', data => console.log("Nhận được:", data));
        }

        var board = Chessboard('myBoard', 'start');
    </script>
</body>
</html>
