<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua Trực Tuyến Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #1c2541;
            --accent-gold: #ffc107;
            --accent-blue: #00b4d8;
            --accent-green: #2ec4b6;
            --accent-red: #e63946;
            --text-light: #edf2f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg-main); 
            color: var(--text-light); 
            min-height: 100vh; 
            padding: 15px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-y: auto !important; 
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 41, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }
        .modal-box {
            background: var(--bg-card); padding: 25px; border-radius: 12px;
            width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #3a506b;
        }
        .modal-box h2 { color: var(--accent-gold); margin-bottom: 15px; font-size: 1.4rem; }

        #gameover-modal { display: none; }
        .gameover-icon { font-size: 3rem; margin-bottom: 10px; }
        #gameover-title { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
        #gameover-desc { font-size: 0.9rem; color: #8d99ae; margin-bottom: 20px; }

        header { text-align: center; margin-bottom: 10px; width: 100%; }
        h1 { color: var(--accent-gold); font-size: 1.4rem; }
        .user-badge { background: rgba(255, 255, 255, 0.08); padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 5px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1); }

        .main-container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; align-items: center; padding-bottom: 30px; }

        .board-box { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            position: relative;
        }
        #myBoard { 
            width: 100% !important; 
            height: 100% !important; 
        }

        /* GỢI Ý Ô CÓ THỂ ĐI (CHẤM TRÒN) */
        .highlight-hint {
            position: absolute;
            width: 32%;
            height: 32%;
            background: rgba(46, 196, 182, 0.9);
            border-radius: 50%;
            top: 34%;
            left: 34%;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(46, 196, 182, 1);
        }

        .highlight-selected {
            box-shadow: inset 0 0 0 4px var(--accent-gold) !important;
            background-color: rgba(255, 193, 7, 0.2) !important;
        }

        .panel { 
            width: 100%; 
            background: var(--bg-card); 
            padding: 12px; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            border: 1px solid #3a506b;
        }
        
        .status-box { background: #0b1329; padding: 8px; border-radius: 6px; text-align: center; font-weight: 600; color: var(--accent-blue); font-size: 0.9rem; }

        .input-group { display: flex; gap: 6px; width: 100%; }
        input, select, button {
            padding: 9px; border-radius: 6px; border: 1px solid #3a506b;
            background: #0b1329; color: white; font-size: 0.85rem; outline: none;
        }
        input { flex: 1; min-width: 0; }
        button { background: var(--accent-green); color: white; font-weight: 600; cursor: pointer; border: none; white-space: nowrap; }
        button:hover { opacity: 0.9; }
        
        .chat-box {
            background: #0b1329; border-radius: 6px; padding: 6px;
            height: 100px; display: flex; flex-direction: column; gap: 4px;
        }
        .chat-messages { flex: 1; overflow-y: auto; font-size: 0.8rem; display: flex; flex-direction: column; gap: 2px; }
        .msg { padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); max-width: 90%; word-break: break-word; }
        .msg.me { background: #1d3557; align-self: flex-end; color: #a8dadc; }
        .msg.peer { background: #3a506b; align-self: flex-start; }

        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="login-modal">
        <div class="modal-box">
            <h2><i class="fa-solid fa-user-gear"></i> ĐĂNG NHẬP</h2>
            <input type="text" id="username-input" placeholder="Tên người chơi..." style="width: 100%; margin-bottom: 12px;" onkeypress="if(event.key==='Enter') login()">
            <button style="width: 100%; padding: 10px;" onclick="login()">VÀO GAME</button>
        </div>
    </div>

    <div class="modal-overlay" id="gameover-modal">
        <div class="modal-box">
            <div id="gameover-icon" class="gameover-icon">🏆</div>
            <h2 id="gameover-title">KẾT QUẢ</h2>
            <div id="gameover-desc">Ván đấu đã kết thúc</div>
            <button style="width: 100%; padding: 10px; background: var(--accent-green);" onclick="closeGameOverModal()">Chơi Ván Mới</button>
        </div>
    </div>

    <header>
        <h1><i class="fa-solid fa-chess"></i> CỜ VUA TRỰC TUYẾN</h1>
        <div class="user-badge">
            <span id="my-name">Khách</span> | <b>ID: <span id="my-id" style="color: var(--accent-gold);">...</span></b>
        </div>
    </header>

    <div class="main-container">
        <div class="board-box">
            <div id="myBoard"></div>
        </div>

        <div class="panel">
            <div class="status-box" id="status">Lượt đi: Trắng</div>

            <div class="input-group">
                <select id="game-mode" style="width:100%" onchange="changeMode()">
                    <option value="ai">Đấu với Máy (AI)</option>
                    <option value="online">Đấu Trực Tuyến (Thách đấu ID)</option>
                </select>
            </div>

            <div class="input-group" id="online-controls" style="display: none;">
                <input type="text" id="peer-id-input" placeholder="ID đối thủ..." maxlength="4">
                <button onclick="requestChallenge()">Thách Đấu</button>
            </div>

            <div class="chat-box" id="chat-container" style="display: none;">
                <div class="chat-messages" id="chat-messages">
                    <div class="msg" style="color: #8d99ae; text-align:center;">Hệ thống chat sẵn sàng</div>
                </div>
                <div class="input-group">
                    <input type="text" id="chat-input" placeholder="Nhắn tin..." onkeydown="if(event.key==='Enter') { event.preventDefault(); sendChat(); }">
                    <button onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <div class="btn-grid" id="ai-buttons">
                <button style="background: var(--accent-blue);" onclick="undoMove()"><i class="fa-solid fa-rotate-left"></i> Đi lại (Undo)</button>
                <button style="background: #f77f00;" onclick="requestReset()"><i class="fa-solid fa-rotate"></i> Ván mới</button>
            </div>

            <div class="btn-grid" id="online-buttons" style="display: none;">
                <button style="background: var(--accent-red);" onclick="resignGame()">Đầu hàng</button>
                <button style="background: var(--accent-gold); color: black;" onclick="offerDraw()">Cầu hòa</button>
                <button style="background: #f77f00;" onclick="requestReset()">Ván mới</button>
            </div>
        </div>
    </div>

    <script>
        let board = null;
        let game = new Chess();
        let peer = null, conn = null;
        let myColor = 'w', gameMode = 'ai';
        let myUsername = "Player";
        let lastChatText = "";
        let isGameOverShown = false;
        
        let selectedSquare = null;
        let possibleMoves = [];

        function login() {
            const name = $('#username-input').val().trim();
            if (!name) return alert('Vui lòng nhập tên!');
            myUsername = name;
            $('#my-name').text(myUsername);
            $('#login-modal').fadeOut();
            setTimeout(() => { 
                board.resize(); 
            }, 150);
            initPeer();
        }

        function initPeer() {
            const randomID = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('chess-' + randomID, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', id => {
                $('#my-id').text(id.replace('chess-', ''));
            });

            peer.on('error', err => { console.error(err); });
            
            peer.on('connection', connection => {
                bindConnection(connection);
            });
        }

        function bindConnection(connection) {
            conn = connection;
            conn.on('data', data => {
                if (data.type === 'challenge_request') {
                    if (confirm(`[${data.fromName}] muốn đấu online với bạn. Đồng ý?`)) {
                        $('#game-mode').val('online');
                        changeMode();
                        
                        myColor = 'b';
                        board.orientation('black');
                        conn.send({ type: 'challenge_response', accepted: true, name: myUsername });
                        resetGame();
                        addChat('Hệ thống', `Đã kết nối với [${data.fromName}]! Bạn cầm quân Đen.`);
                    } else {
                        conn.send({ type: 'challenge_response', accepted: false });
                    }
                } else {
                    handleIncomingData(data);
                }
            });
        }

        function requestChallenge() {
            const targetID = $('#peer-id-input').val().trim();
            if (!targetID) return alert('Nhập ID đối thủ!');
            
            gameMode = 'online';
            const tempConn = peer.connect('chess-' + targetID);
            
            tempConn.on('open', () => {
                bindConnection(tempConn);
                conn.send({ type: 'challenge_request', fromName: myUsername });
            });

            tempConn.on('data', data => {
                if (data.type === 'challenge_response') {
                    if (data.accepted) {
                        myColor = 'w';
                        board.orientation('white');
                        resetGame();
                        addChat('Hệ thống', `Đã kết nối thành công với [${data.name}]! Bạn cầm quân Trắng.`);
                    } else {
                        alert('Đối thủ từ chối thách đấu.');
                    }
                } else {
                    handleIncomingData(data);
                }
            });
        }

        function handleIncomingData(data) {
            if (data.type === 'move') {
                animateMove(data.move.from, data.move.to, () => {
                    game.move(data.move);
                    board.position(game.fen());
                    updateStatus();
                });
            } else if (data.type === 'chat') {
                addChat(data.sender, data.text, 'peer');
            } else if (data.type === 'resign') {
                showGameOver('BẠN THẮNG! 🎉', 'Đối thủ đã xin đầu hàng.', '🏆', 'var(--accent-green)');
            } else if (data.type === 'draw_request') {
                if (confirm('Đối thủ cầu hòa. Đồng ý?')) {
                    conn.send({ type: 'draw_accept' });
                    showGameOver('VÁN HÒA', 'Hai người đã đồng ý hòa trận.', '🤝', 'var(--accent-gold)');
                }
            } else if (data.type === 'draw_accept') {
                showGameOver('VÁN HÒA', 'Đối thủ đã đồng ý hòa.', '🤝', 'var(--accent-gold)');
            } else if (data.type === 'reset') {
                resetGame();
            }
        }

        // HỆ THỐNG CLICK CHỌN Ô & DI CHUYỂN
        function onSquareClick(square) {
            if (game.game_over()) return;
            
            if (gameMode === 'online') {
                if (!conn) return;
                if ((game.turn() === 'w' && myColor !== 'w') || (game.turn() === 'b' && myColor !== 'b')) return;
            }

            // Nếu đã chọn quân cờ từ trước và bấm vào một ô đích hợp lệ
            if (selectedSquare) {
                let matchMove = possibleMoves.find(m => m.to === square);
                if (matchMove) {
                    let from = selectedSquare;
                    clearHighlights();
                    selectedSquare = null;

                    animateMove(from, square, () => {
                        game.move({ from: from, to: square, promotion: 'q' });
                        board.position(game.fen());
                        updateStatus();

                        if (conn && conn.open) {
                            conn.send({ type: 'move', move: { from: from, to: square, promotion: 'q' } });
                        } else if (gameMode === 'ai' && !game.game_over()) {
                            setTimeout(makeAIMove, 300);
                        }
                    });
                    return;
                }
            }

            // Chọn quân cờ mới của mình
            clearHighlights();
            let piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                if (gameMode === 'online' && piece.color !== myColor) return;
                
                selectedSquare = square;
                $(`#myBoard .square-${square}`).addClass('highlight-selected');
                
                possibleMoves = game.moves({ square: square, verbose: true });
                possibleMoves.forEach(m => {
                    $(`#myBoard .square-${m.to}`).append('<div class="highlight-hint"></div>');
                });
            } else {
                selectedSquare = null;
            }
        }

        function clearHighlights() {
            $('#myBoard .square-55d63').removeClass('highlight-selected');
            $('#myBoard .highlight-hint').remove();
        }

        // ANIMATION DI CHUYỂN MƯỢT MÀ
        function animateMove(source, target, callback) {
            let pieceObj = game.get(source);
            let $sourceSquare = $(`#myBoard .square-${source}`);
            let $targetSquare = $(`#myBoard .square-${target}`);
            let $pieceImg = $sourceSquare.find('img');

            if (!pieceObj || $pieceImg.length === 0) {
                callback();
                return;
            }

            let $clone = $pieceImg.clone().appendTo('#myBoard').css({
                position: 'absolute',
                zIndex: 1000,
                left: $sourceSquare.position().left,
                top: $sourceSquare.position().top,
                width: $sourceSquare.width(),
                height: $sourceSquare.height()
            });

            $pieceImg.hide();
            let targetPos = $targetSquare.position();

            let $targetPieceImg = $targetSquare.find('img');
            if ($targetPieceImg.length > 0 && game.get(target)) {
                $targetPieceImg.fadeOut(250);
            }

            if (pieceObj.type === 'n') {
                let midLeft = (targetPos.left + $sourceSquare.position().left) / 2;
                let midTop = Math.min(targetPos.top, $sourceSquare.position().top) - 35;

                $clone.animate({ left: midLeft, top: midTop }, 160, 'linear', function() {
                    $(this).animate({ left: targetPos.left, top: targetPos.top }, 160, 'linear', function() {
                        $(this).remove();
                        callback();
                    });
                });
            } else {
                $clone.animate({ left: targetPos.left, top: targetPos.top }, 220, 'swing', function() {
                    $(this).remove();
                    callback();
                });
            }
        }

        function makeAIMove() {
            if (gameMode !== 'ai' || (conn && conn.open)) return;
            const possibleMovesList = game.moves({ verbose: true });
            if (possibleMovesList.length === 0) return;
            
            const randomMove = possibleMovesList[Math.floor(Math.random() * possibleMovesList.length)];
            
            animateMove(randomMove.from, randomMove.to, () => {
                game.move(randomMove);
                board.position(game.fen());
                updateStatus();
            });
        }

        function undoMove() {
            if (gameMode !== 'ai') return alert('Chỉ dùng tính năng đi lại khi đấu với Máy!');
            if (game.game_over()) isGameOverShown = false;
            
            game.undo();
            game.undo();
            board.position(game.fen());
            clearHighlights();
            updateStatus();
        }

        function sendChat() {
            const txt = $('#chat-input').val().trim();
            if (!txt) return;
            
            if (txt === lastChatText) {
                $('#chat-input').val('');
                return;
            }
            lastChatText = txt;
            setTimeout(() => { lastChatText = ""; }, 500);

            addChat(myUsername, txt, 'me');
            if (conn && conn.open) {
                conn.send({ type: 'chat', text: txt, sender: myUsername });
            }
            $('#chat-input').val('');
        }

        function addChat(sender, txt, cls = '') {
            $('#chat-messages').append(`<div class="msg ${cls}"><b>${sender}:</b> ${txt}</div>`);
            $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
        }

        function resignGame() {
            if (confirm('Bạn có chắc chắn muốn đầu hàng?')) {
                if (conn && conn.open) conn.send({ type: 'resign' });
                showGameOver('BẠN THUA 😢', 'Bạn đã nhận thua ván đấu này.', '❌', 'var(--accent-red)');
            }
        }

        function offerDraw() {
            if (conn && conn.open) {
                conn.send({ type: 'draw_request' });
                alert('Đã gửi yêu cầu cầu hòa!');
            } else alert('Chỉ dùng được khi đấu online!');
        }

        function requestReset() { 
            if (conn && conn.open) conn.send({ type: 'reset' });
            resetGame(); 
        }

        function resetGame() {
            game.reset();
            board.position('start');
            clearHighlights();
            selectedSquare = null;
            isGameOverShown = false;
            if (gameMode === 'online') {
                board.orientation(myColor === 'w' ? 'white' : 'black');
            } else {
                board.orientation('white');
            }
            updateStatus();
        }

        function showGameOver(title, desc, icon, color) {
            if (isGameOverShown) return;
            isGameOverShown = true;
            $('#gameover-icon').text(icon);
            $('#gameover-title').text(title).css('color', color);
            $('#gameover-desc').text(desc);
            $('#gameover-modal').fadeIn();
        }

        function closeGameOverModal() {
            $('#gameover-modal').fadeOut();
            requestReset();
        }

        function updateStatus() {
            let statusText = '';
            const turn = game.turn() === 'w' ? 'Trắng' : 'Đen';
            
            if (game.in_checkmate()) {
                statusText = `CHIẾU BÍ! Bên ${turn} thua.`;
                $('#status').text(statusText);
                
                if (gameMode === 'ai') {
                    if (turn === 'Trắng') {
                        showGameOver('BẠN THUA 😢', 'Máy đã chiếu bí bạn.', '❌', 'var(--accent-red)');
                    } else {
                        showGameOver('BẠN THẮNG! 🎉', 'Bạn đã chiếu bí máy thành công.', '🏆', 'var(--accent-green)');
                    }
                } else {
                    const currentTurnColor = game.turn();
                    if (currentTurnColor === myColor) {
                        showGameOver('BẠN THUA 😢', 'Bạn đã bị đối thủ chiếu bí.', '❌', 'var(--accent-red)');
                    } else {
                        showGameOver('BẠN THẮNG! 🎉', 'Bạn đã chiếu bí đối thủ.', '🏆', 'var(--accent-green)');
                    }
                }
                return;
            } else if (game.in_draw()) {
                statusText = `VÁN HÒA!`;
                $('#status').text(statusText);
                showGameOver('VÁN HÒA', 'Trận đấu kết thúc với kết quả hòa.', '🤝', 'var(--accent-gold)');
                return;
            } else {
                statusText = `Đến lượt: ${turn} ${game.in_check() ? '(CHIẾU!)' : ''}`;
            }
            $('#status').text(statusText);
        }

        function changeMode() {
            gameMode = $('#game-mode').val();
            if (gameMode === 'online') {
                $('#online-controls, #chat-container, #online-buttons').show();
                $('#ai-buttons').hide();
            } else {
                $('#online-controls, #chat-container, #online-buttons').hide();
                $('#ai-buttons').show();
                if (conn) {
                    conn.close();
                    conn = null;
                }
            }
            resetGame();
        }

        // KHỞI TẠO BÀN CỜ VÀ GẮN SỰ KIỆN CLICK TRỰC TIẾP QUA CHESSBOARD.JS
        board = Chessboard('myBoard', {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onSquareClick: function(square) {
                onSquareClick(square);
            }
        });

        $(window).resize(() => board.resize());
    </script>
</body>
</html>
